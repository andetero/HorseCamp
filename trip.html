<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HorseCamp Shared Trip</title><meta name="description" content="View a shared HorseCamp trip and open it in the HorseCamp app."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--earth:#3D2B1A;--hay:#D4A853;--trail:#5C7A4E;--cream:#FAF6EE;--saddle:#8B5E3C;--warm:#EDE8DF}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--earth)}nav{background:var(--earth);padding:1rem 5vw;display:flex;gap:.7rem;align-items:center}.logo{font:700 1.2rem 'Playfair Display',serif;color:var(--hay)}.badge{background:var(--trail);color:white;border-radius:5px;padding:2px 8px;font-size:.7rem;font-weight:600}.hero{background:var(--earth);padding:2rem 5vw}.hero h1{margin:0;color:var(--hay);font:700 1.9rem 'Playfair Display',serif}.hero p{color:rgba(255,255,255,.5);font-size:.85rem}.main{max-width:680px;margin:auto;padding:2rem 5vw}.card{background:white;border-radius:16px;padding:20px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 12px rgba(0,0,0,.05)}.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.to{text-align:right}.label,.section-title{font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--saddle);font-weight:600}.name{font-weight:600;margin-top:2px}.arrow{color:var(--hay);font-size:1.2rem}.meta{display:flex;gap:22px;flex-wrap:wrap;padding:14px 0;margin:16px 0;border-top:1px solid var(--warm);border-bottom:1px solid var(--warm)}.value{font-weight:600;margin-top:2px}.section{margin-top:18px}.row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--warm)}.row:last-child{border-bottom:0}.num{width:25px;height:25px;border-radius:50%;background:var(--hay);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex:0 0 auto}.row-title{font-size:.92rem;font-weight:600}.row-sub{font-size:.78rem;color:#888;margin-top:2px}.advisory{background:#FFF7E0;border-left:3px solid var(--hay);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.84rem;line-height:1.5}.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--hay);color:var(--earth);padding:14px;margin-top:20px;font-weight:700;font-size:1rem;cursor:pointer}.note{text-align:center;color:#888;font-size:.78rem;line-height:1.5;margin-top:10px}.stores{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap;margin-top:14px}.store{border:1px solid rgba(139,94,60,.3);color:var(--saddle);text-decoration:none;border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:600}.error{text-align:center;padding:35px 10px}.error h2{font-family:'Playfair Display',serif}.error p{color:#777;line-height:1.6}@media(prefers-color-scheme:dark){body{background:#1C1208;color:#FAF6EE}.card{background:#2C1E10;border-color:rgba(255,255,255,.08)}.meta,.row{border-color:rgba(255,255,255,.08)}.advisory{background:#3A2A12}.row-sub,.note,.error p{color:rgba(250,246,238,.55)}}</style></head><body><nav><span class="logo">HorseCamp</span><span class="badge">SHARED TRIP</span></nav><div class="hero"><h1 id="trip-name">Shared Trip</h1><p>View the itinerary, then open HorseCamp to import or continue planning.</p></div><main class="main" id="main"><div class="error"><p>Loading trip…</p></div></main><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(ts){if(!ts)return 'Not specified';var d=new Date(Number(ts)*1000);return isNaN(d.getTime())?'Not specified':d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
function fmtDrive(obj){if(!obj)return'';var seconds=Number(obj.driveSeconds);if(!Number.isFinite(seconds)){var minutes=Number(obj.driveMinutes);if(Number.isFinite(minutes))seconds=minutes*60}if(!Number.isFinite(seconds)||seconds<=0)return'';var mins=Math.round(seconds/60),h=Math.floor(mins/60),m=mins%60;return h?(h+' hr'+(m?' '+m+' min':'')):(m+' min')}
function stopName(s){return s.campName||s.name||s.title||'Planned stop'}
function stopLocation(s){return s.location||s.address||s.subtitle||''}
function renderStops(title,items,start){if(!Array.isArray(items)||!items.length)return'';var out='<div class="section"><div class="section-title">'+esc(title)+'</div>';items.forEach(function(s,i){var detail=[stopLocation(s),fmtDrive(s)].filter(Boolean).join(' · ');out+='<div class="row"><div class="num">'+(start+i)+'</div><div><div class="row-title">'+esc(stopName(s))+'</div>'+(detail?'<div class="row-sub">'+esc(detail)+'</div>':'')+'</div></div>'});return out+'</div>'}
function renderAdvisories(items){if(!Array.isArray(items)||!items.length)return'';var out='<div class="section"><div class="section-title">Route Advisories</div>';items.forEach(function(a){var text=typeof a==='string'?a:(a.message||a.text||a.title||'');if(text)out+='<div class="advisory">'+esc(text)+'</div>'});return out+'</div>'}
function fail(msg){document.getElementById('main').innerHTML='<div class="error"><h2>Trip unavailable</h2><p>'+esc(msg)+'</p><div class="stores"><a class="store" href="https://apps.apple.com/us/app/horsecamp/id6761319280">App Store</a><a class="store" href="https://play.google.com/store/apps/details?id=com.pyoba.HorseCamp">Google Play</a></div></div>'}
function go(){var params=new URLSearchParams(location.search);var raw=params.get('d');if(!raw){fail('This shared trip link does not contain trip data. Ask the sender to share the trip again from HorseCamp.');return}var trip;try{trip=JSON.parse(raw)}catch(e){try{trip=JSON.parse(decodeURIComponent(raw))}catch(e2){fail('This shared trip link could not be read. It may be incomplete or from an unsupported older format.');return}}
document.getElementById('trip-name').textContent=trip.name||'Shared Trip';var planned=Array.isArray(trip.plannedStops)?trip.plannedStops:[];var camps=Array.isArray(trip.stops)?trip.stops:[];var total=planned.length+camps.length;var html='<div class="card"><div class="route"><div><div class="label">From</div><div class="name">'+esc(trip.originName||'—')+'</div></div><div class="arrow">→</div><div class="to"><div class="label">To</div><div class="name">'+esc(trip.destinationName||'—')+'</div></div></div><div class="meta"><div><div class="label">Departure</div><div class="value">'+esc(fmtDate(trip.departureSince1970))+'</div></div><div><div class="label">Planned stops</div><div class="value">'+total+'</div></div></div>';html+=renderStops('Planned Stops',planned,1);html+=renderStops('Overnight Camps',camps,planned.length+1);html+=renderAdvisories(trip.advisories||trip.routeAdvisories||[]);html+='<button class="btn" id="openbtn">Open in HorseCamp</button><div class="note">HorseCamp on iPhone or Android can import supported shared-trip data. Newer app versions may contain additional route details not shown on this page.</div><div class="stores"><a class="store" href="https://apps.apple.com/us/app/horsecamp/id6761319280" target="_blank" rel="noopener">App Store</a><a class="store" href="https://play.google.com/store/apps/details?id=com.pyoba.HorseCamp" target="_blank" rel="noopener">Google Play</a></div></div>';document.getElementById('main').innerHTML=html;document.getElementById('openbtn').addEventListener('click',function(){location.href='horsecamp://trip?d='+encodeURIComponent(raw)})}
window.addEventListener('error',function(){fail('Something went wrong while displaying this trip. Try opening the link directly in HorseCamp.')});go();
</script></body></html>

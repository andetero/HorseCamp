name: Seed Camp Data
on:
  schedule:
    # Runs nightly at 2:00 AM Mountain Time
    - cron: "0 2 * * *"
      timezone: "America/Denver"
  workflow_dispatch:
jobs:
  fetch-camps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch camp data
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python scripts/fetch_camps.py
      - name: Validate camp feed schema
        run: python scripts/validate_camps_feed.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add camps.json data/geocode_cache.json
          git diff --staged --quiet || git commit -m "chore: update camp data $(date -u '+%Y-%m-%d')"
          git push

name: Apply Description Sanitizer Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-description-sanitizer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Patch fetch_camps.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/fetch_camps.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "from datetime import datetime, timezone\nfrom pathlib import Path\n",
              "from datetime import datetime, timezone\nfrom html.parser import HTMLParser\nfrom pathlib import Path\n",
          )

          old = '''def strip_html(text):
              return re.sub(r'<[^>]+>', '', text or '').strip()

          def is_equestrian(text_blob):
          '''
          new = '''HTML_BLOCK_TAGS = {
              "address", "article", "aside", "blockquote", "br", "div", "dl", "dt", "dd",
              "fieldset", "figcaption", "figure", "footer", "form", "h1", "h2", "h3",
              "h4", "h5", "h6", "header", "hr", "li", "main", "nav", "ol", "p",
              "pre", "section", "table", "tbody", "td", "tfoot", "th", "thead", "tr", "ul",
          }
          HTML_DISCARD_TAGS = {"script", "style", "iframe", "noscript", "svg"}
          HTML_TAG_RE = re.compile(r"<\\s*/?\\s*[A-Za-z][^>]*>")
          HTML_ENTITY_RE = re.compile(r"&(?:#\\d+|#x[0-9A-Fa-f]+|[A-Za-z][A-Za-z0-9]+);")


          class _DescriptionHTMLParser(HTMLParser):
              """Convert source HTML to safe readable plain text using only the standard library."""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.discard_depth = 0

              def _separator(self):
                  if self.parts and not self.parts[-1].endswith((" ", "\\n")):
                      self.parts.append("\\n")

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag in HTML_DISCARD_TAGS:
                      self.discard_depth += 1
                      return
                  if self.discard_depth:
                      return
                  if tag == "li":
                      self._separator()
                      self.parts.append("• ")
                  elif tag in HTML_BLOCK_TAGS:
                      self._separator()

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag in HTML_DISCARD_TAGS:
                      if self.discard_depth:
                          self.discard_depth -= 1
                      return
                  if self.discard_depth:
                      return
                  if tag in HTML_BLOCK_TAGS:
                      self._separator()

              def handle_data(self, data):
                  if not self.discard_depth and data:
                      self.parts.append(data)


          def sanitize_html_text(value):
              """Decode entities and remove HTML while retaining readable text and list markers."""
              raw = str(value or "").replace("\\x00", " ")
              if not raw:
                  return ""

              # Decode twice so encoded markup such as &amp;lt;p&amp;gt; is handled as markup.
              for _ in range(2):
                  decoded = html.unescape(raw)
                  if decoded == raw:
                      break
                  raw = decoded

              parser = _DescriptionHTMLParser()
              try:
                  parser.feed(raw)
                  parser.close()
                  cleaned = "".join(parser.parts)
              except Exception:
                  # Defensive fallback for unexpectedly malformed source markup.
                  cleaned = raw

              # A final pass removes any malformed tag fragments the parser treated as text.
              cleaned = HTML_TAG_RE.sub(" ", html.unescape(cleaned))
              cleaned = re.sub(r"\\s+", " ", cleaned).strip()
              cleaned = re.sub(r"\\s+([,.;:!?])", r"\\1", cleaned)
              return cleaned


          def strip_html(text):
              return sanitize_html_text(text)

          def is_equestrian(text_blob):
          '''
          if old not in text:
              raise SystemExit("Expected strip_html block was not found")
          text = text.replace(old, new)

          old = '''def normalize_description_text(value):
              """Keep JSON description values as one readable line."""
              return re.sub(r"\\s+", " ", str(value or "")).strip()
          '''
          new = '''def normalize_description_text(value):
              """Store description values as safe, decoded, readable plain text."""
              return sanitize_html_text(value)
          '''
          if old not in text:
              raise SystemExit("Expected normalize_description_text block was not found")
          text = text.replace(old, new)

          old = '''        retired = sorted(PUBLIC_FEED_OMIT_FIELDS & set(camp.keys()))
                  if retired:
                      errors.append(f"{label} ({camp_id or 'no-id'}) retains omitted fields: {', '.join(retired)}")

              if errors:
          '''
          new = '''        description = str(camp.get("description") or "")
                  if HTML_TAG_RE.search(description):
                      errors.append(f"{label} ({camp_id or 'no-id'}) description contains HTML tags")
                  if HTML_ENTITY_RE.search(description):
                      errors.append(f"{label} ({camp_id or 'no-id'}) description contains encoded HTML entities")

                  retired = sorted(PUBLIC_FEED_OMIT_FIELDS & set(camp.keys()))
                  if retired:
                      errors.append(f"{label} ({camp_id or 'no-id'}) retains omitted fields: {', '.join(retired)}")

              if errors:
          '''
          if old not in text:
              raise SystemExit("Expected public-feed validation block was not found")
          text = text.replace(old, new)

          old = '''    camps_list = sorted(all_camps.values(), key=lambda c: (c["state"], c["name"]))
              retired_field_count = strip_public_feed_fields(camps_list)
              validate_public_feed(camps_list)
          '''
          new = '''    camps_list = sorted(all_camps.values(), key=lambda c: (c["state"], c["name"]))
              retired_field_count = strip_public_feed_fields(camps_list)
              descriptions_before = [str(camp.get("description") or "") for camp in camps_list]
              camps_list = normalize_description_fields(camps_list)
              sanitized_description_count = sum(
                  before != str(camp.get("description") or "")
                  for before, camp in zip(descriptions_before, camps_list)
              )
              print_metric("Descriptions sanitized", sanitized_description_count)
              validate_public_feed(camps_list)
          '''
          if old not in text:
              raise SystemExit("Expected final feed preparation block was not found")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched script and current feed
        run: |
          python -m py_compile scripts/fetch_camps.py
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("fetch_camps", "scripts/fetch_camps.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          feed = json.loads(Path("camps.json").read_text(encoding="utf-8"))
          before = [str(camp.get("description") or "") for camp in feed["camps"]]
          camps = module.normalize_description_fields(feed["camps"])
          changed = sum(
              old != str(camp.get("description") or "")
              for old, camp in zip(before, camps)
          )
          assert not any(module.HTML_TAG_RE.search(str(camp.get("description") or "")) for camp in camps)
          assert not any(module.HTML_ENTITY_RE.search(str(camp.get("description") or "")) for camp in camps)
          module.validate_public_feed(camps)
          print(f"Validated {len(camps)} camps; {changed} descriptions would be normalized")
          PY

      - name: Commit permanent script change
        run: |
          rm .github/workflows/apply-description-sanitizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch_camps.py .github/workflows/apply-description-sanitizer.yml
          git commit -m "fix: sanitize HTML in camp descriptions"
          git push

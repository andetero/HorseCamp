name: Approve HorseCamp Data Fix

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Problem-report issue number to approve"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: approve-horsecamp-data-fix-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  approved-problem-report-to-pr:
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved' &&
       contains(github.event.issue.labels.*.name, 'problem-report') &&
       contains(github.event.issue.labels.*.name, 'data-fix') &&
       !contains(github.event.issue.labels.*.name, 'pr-created')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate issue labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ steps.issue.outputs.number }}" --json labels --jq '.labels[].name' > /tmp/issue_labels.txt

          require_label() {
            if ! grep -Fxq "$1" /tmp/issue_labels.txt; then
              echo "Issue #${{ steps.issue.outputs.number }} is missing required label: $1" >&2
              exit 1
            fi
          }

          require_label "approved"
          require_label "problem-report"
          require_label "data-fix"

          if grep -Fxq "pr-created" /tmp/issue_labels.txt; then
            echo "Issue #${{ steps.issue.outputs.number }} already has pr-created; nothing to do." >&2
            exit 1
          fi

      - name: Create data-fix branch
        run: git checkout -B "data-fix-${{ steps.issue.outputs.number }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ steps.issue.outputs.number }}" --json body --jq .body > /tmp/horsecamp_problem_report_issue.md

      - name: Convert approved problem report into exclusion update
        id: process
        run: |
          python scripts/approve_problem_report.py \
            --issue-body /tmp/horsecamp_problem_report_issue.md \
            --issue-number "${{ steps.issue.outputs.number }}"

      - name: Commit data-fix source JSON update
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit source/review files here. Do NOT run fetch_camps.py or update camps.json.
          # The scheduled Seed Camp Data workflow will rebuild camps.json overnight, or you can run it manually.
          git add data/exclusions.json data/problem_reports

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: approve HorseCamp data fix #${{ steps.issue.outputs.number }}"
            git push --force origin "data-fix-${{ steps.issue.outputs.number }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/horsecamp_data_fix_pr_body.md <<'EOF'
          ${{ steps.process.outputs.pr_body }}
          EOF

          PR_URL=$(gh pr view "data-fix-${{ steps.issue.outputs.number }}" --json url --jq .url 2>/dev/null || gh pr create \
            --base main \
            --head "data-fix-${{ steps.issue.outputs.number }}" \
            --title "${{ steps.process.outputs.pr_title }}" \
            --body-file /tmp/horsecamp_data_fix_pr_body.md)

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue and update labels
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --body "Approved data-fix report converted into a PR for final review: ${{ steps.pr.outputs.url }}"

          # Make this idempotent: create the status label if it does not already exist.
          gh label create "pr-created" --color "8250df" --description "Submission or data-fix PR has been created" 2>/dev/null || true

          # Remove/add labels without failing the whole workflow if a label is already absent/present.
          gh issue edit "${{ steps.issue.outputs.number }}" --remove-label "needs-review" || true
          gh issue edit "${{ steps.issue.outputs.number }}" --add-label "pr-created" || true

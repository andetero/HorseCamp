name: Temporary Run Alabama State Parks Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-alabama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Alabama test branch
        uses: actions/checkout@v6
        with:
          ref: stateparks-alabama-test
          fetch-depth: 0

      - name: Restore full fetch_camps.py from main baseline
        run: git show origin/main:scripts/fetch_camps.py > scripts/fetch_camps.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Apply and validate Alabama conversion
        run: python scripts/temp_apply_alabama_dynamic.py

      - name: Syntax check
        run: python -m py_compile scripts/fetch_camps.py

      - name: Commit validated Alabama conversion to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scripts/fetch_camps.py scripts/temp_apply_alabama_dynamic.py data/state_parks/al.json data/geocode_cache.json
          git commit -m "Make Alabama State Parks dynamic"
          git push origin HEAD:stateparks-alabama-test

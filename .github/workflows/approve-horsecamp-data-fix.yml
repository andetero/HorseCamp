name: Approve HorseCamp Data Fix

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Problem-report issue number to approve"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: approve-horsecamp-data-fix-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  dispatch-approved-data-fix:
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved' &&
       contains(github.event.issue.labels.*.name, 'problem-report') &&
       !contains(github.event.issue.labels.*.name, 'backend-dispatched') &&
       !contains(github.event.issue.labels.*.name, 'backend-processed')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid issue number" >&2; exit 1; }
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate public issue labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' > /tmp/issue_labels.txt

          grep -Fxq "approved" /tmp/issue_labels.txt || { echo "Issue #$ISSUE_NUMBER is missing approved" >&2; exit 1; }
          grep -Fxq "problem-report" /tmp/issue_labels.txt || { echo "Issue #$ISSUE_NUMBER is missing problem-report" >&2; exit 1; }

          if grep -Fxq "backend-processed" /tmp/issue_labels.txt; then
            echo "Issue #$ISSUE_NUMBER has already been processed." >&2
            exit 1
          fi

      - name: Verify private-backend token
        env:
          HORSECAMP_BACKEND_TOKEN: ${{ secrets.HORSECAMP_BACKEND_TOKEN }}
        run: |
          test -n "$HORSECAMP_BACKEND_TOKEN" || {
            echo "Missing HORSECAMP_BACKEND_TOKEN repository secret." >&2
            exit 1
          }

      - name: Dispatch approved data fix to HorseCampPrivate
        env:
          GH_TOKEN: ${{ secrets.HORSECAMP_BACKEND_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          jq -n \
            --arg issue_number "$ISSUE_NUMBER" \
            '{event_type:"approved-data-fix",client_payload:{issue_number:$issue_number}}' \
            > /tmp/dispatch.json

          gh api \
            --method POST \
            repos/andetero/HorseCampPrivate/dispatches \
            --input /tmp/dispatch.json

      - name: Mark public issue dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh label create "backend-dispatched" \
            --color "0969da" \
            --description "Approved issue sent to the private HorseCamp data backend" \
            2>/dev/null || true

          gh issue edit "$ISSUE_NUMBER" --remove-label "needs-review" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --add-label "backend-dispatched"

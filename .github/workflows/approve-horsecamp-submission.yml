name: Approve HorseCamp Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: approve-horsecamp-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  approved-submission-to-pr:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'submission') && !contains(github.event.issue.labels.*.name, 'pr-created')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create approval branch
        run: git checkout -B "submission-${{ github.event.issue.number }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ github.event.issue.number }}" --json body --jq .body > /tmp/horsecamp_submission_issue.md

      - name: Convert approved issue into JSON update
        id: process
        run: |
          python scripts/approve_submission.py \
            --issue-body /tmp/horsecamp_submission_issue.md \
            --issue-number "${{ github.event.issue.number }}"

      - name: Commit submission source JSON update
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit source/staging files here. Do NOT run fetch_camps.py or update camps.json.
          # The scheduled Seed Camp Data workflow will rebuild camps.json overnight, or you can run it manually.
          git add data/private_camps.json

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: approve HorseCamp submission #${{ github.event.issue.number }}"
            # This branch is fully managed by this workflow. Force push avoids stale branch conflicts
            # from earlier failed/retried approval runs for the same issue.
            git push --force origin "submission-${{ github.event.issue.number }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/horsecamp_pr_body.md <<'EOF'
          ${{ steps.process.outputs.pr_body }}
          EOF

          PR_URL=$(gh pr view "submission-${{ github.event.issue.number }}" --json url --jq .url 2>/dev/null || gh pr create \
            --base main \
            --head "submission-${{ github.event.issue.number }}" \
            --title "${{ steps.process.outputs.pr_title }}" \
            --body-file /tmp/horsecamp_pr_body.md)

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue and update labels
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          
          # Make this idempotent: create the status label if it does not already exist.
          gh label create "pr-created" --color "8250df" --description "Submission PR has been created" 2>/dev/null || true

          # Remove/add labels without failing the whole workflow if a label is already absent/present.
          gh issue edit "${{ github.event.issue.number }}" --remove-label "needs-review" || true
          gh issue edit "${{ github.event.issue.number }}" --add-label "pr-created" || true

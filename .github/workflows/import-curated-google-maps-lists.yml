name: Import Curated Google Maps Lists

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run scripts/fetch_camps.py after importing JSON"
        required: true
        type: boolean
        default: true
      commit_outputs:
        description: "Commit imported JSON/report/camps.json back to repo"
        required: true
        type: boolean
        default: true
      fail_on_missing_csv:
        description: "Fail if either expected CSV is missing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  import-google-maps-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Import Google Maps Saved List CSVs
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.fail_on_missing_csv }}" = "true" ]; then
            EXTRA_ARGS="--fail-on-missing-csv"
          fi

          python scripts/import_google_maps_lists.py \
            --layovers-csv data/imports/horse_layovers.csv \
            --private-camps-csv data/imports/horse_camps.csv \
            --layovers-json data/layovers.json \
            --private-camps-json data/private_camps.json \
            --report data/imports/google_maps_list_import_report.md \
            $EXTRA_ARGS

      - name: Install seed dependencies
        if: ${{ inputs.run_seed }}
        run: pip install requests

      - name: Run Seed Camp Data after import
        if: ${{ inputs.run_seed }}
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python scripts/fetch_camps.py

      - name: Upload import outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-list-import-outputs
          path: |
            data/layovers.json
            data/private_camps.json
            data/imports/google_maps_list_import_report.md
            camps.json

      - name: Commit outputs
        if: ${{ inputs.commit_outputs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/layovers.json data/private_camps.json data/imports/google_maps_list_import_report.md
          if [ "${{ inputs.run_seed }}" = "true" ]; then
            git add camps.json
          fi
          git diff --staged --quiet || git commit -m "chore: import curated Google Maps lists"
          git push

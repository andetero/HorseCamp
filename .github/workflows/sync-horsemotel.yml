name: Sync HorseMotel.com Listings

on:
  schedule:
    # Runs nightly at 12:00 AM Mountain Time.
    - cron: "0 0 * * *"
      timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional authorized HorseMotel.com feed URL. Leave blank to read HorseMotel.com listing pages directly."
        required: false
        type: string
      run_seed:
        description: "Run scripts/fetch_camps.py after syncing HorseMotel.com listings"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-horsemotel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Import authorized HorseMotel.com listings
        run: |
          EXTRA_ARGS="--allow-empty"

          if [ -n "${{ inputs.source_url }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --source-url '${{ inputs.source_url }}'"
          elif [ -n "${{ secrets.HORSEMOTEL_SOURCE_URL }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --source-url '${{ secrets.HORSEMOTEL_SOURCE_URL }}'"
          else
            EXTRA_ARGS="$EXTRA_ARGS --scrape-site --site-url 'https://www.horsemotel.com/'"
          fi

          python scripts/import_horsemotel.py \
            --csv data/imports/horsemotel_listings.csv \
            --output data/horsemotel_listings.json \
            --report data/imports/horsemotel_import_report.md \
            $EXTRA_ARGS

      - name: Install seed dependencies
        if: ${{ inputs.run_seed || github.event_name == 'schedule' }}
        run: pip install requests

      - name: Run Seed Camp Data after HorseMotel.com sync
        if: ${{ inputs.run_seed || github.event_name == 'schedule' }}
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python scripts/fetch_camps.py

      - name: Upload HorseMotel.com sync outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: horsemotel-sync-outputs
          path: |
            data/horsemotel_listings.json
            data/imports/horsemotel_import_report.md
            camps.json

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/horsemotel_listings.json
          git add data/imports/horsemotel_import_report.md

          if [ "${{ inputs.run_seed }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            git add camps.json
          fi

          if git diff --staged --quiet; then
            echo "No HorseMotel.com changes to commit."
          else
            git commit -m "chore: sync HorseMotel.com listings"
            git push
          fi
